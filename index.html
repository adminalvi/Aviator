<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator VIP Real Game</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0e131b; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #161d2b; border-bottom: 2px solid #283447; }
        .logo { font-size: 24px; font-weight: 900; color: #e50914; font-style: italic; letter-spacing: 1px; }
        .logo span { color: #fff; }
        .user-panel { display: flex; align-items: center; gap: 15px; }
        .balance-box { background: #0b0e14; padding: 8px 15px; border-radius: 20px; border: 1px solid #283447; font-size: 14px; color: #28a745; font-weight: bold; }
        .btn-auth { background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-auth:hover { background: #b20710; }

        /* Game Arena */
        .game-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .canvas-card { flex: 1; background: radial-gradient(circle at center, #1b2435 0%, #0d121c 100%); border-radius: 12px; border: 1px solid #283447; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        canvas { width: 100%; height: 100%; display: block; }
        
        .multiplier-overlay { position: absolute; font-size: 64px; font-weight: 900; color: #ffffff; text-shadow: 0 0 20px rgba(255,255,255,0.4); z-index: 10; pointer-events: none; }
        .multiplier-overlay.crashed { color: #e50914; text-shadow: 0 0 20px rgba(229,9,20,0.6); }

        /* Betting Controls */
        .controls-card { background: #161d2b; padding: 20px; border-radius: 12px; border: 1px solid #283447; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .bet-box { background: #0b0e14; padding: 15px; border-radius: 10px; border: 1px solid #283447; display: flex; flex-direction: column; gap: 10px; }
        .input-group { display: flex; align-items: center; gap: 10px; }
        .input-group input { width: 100%; padding: 10px; background: #161d2b; border: 1px solid #283447; border-radius: 5px; color: #fff; font-size: 16px; font-weight: bold; }
        
        .btn-action { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-bet { background: #28a745; color: #fff; box-shadow: 0 4px 15px rgba(40,167,69,0.3); }
        .btn-bet:hover { background: #218838; }
        .btn-cashout { background: #ffc107; color: #000; box-shadow: 0 4px 15px rgba(255,193,7,0.3); }
        .btn-cashout:hover { background: #e0a800; }
        .btn-disabled { background: #495057 !important; cursor: not-allowed !important; box-shadow: none !important; }

        /* Admin Target Button */
        .admin-box { position: absolute; top: 15px; right: 15px; z-index: 20; background: rgba(0,0,0,0.7); padding: 8px; border-radius: 8px; border: 1px solid #ffc107; display: flex; gap: 5px; }
        .admin-box input { width: 70px; padding: 5px; background: #000; border: 1px solid #ffc107; color: #fff; border-radius: 4px; text-align: center; }
        .admin-box button { background: #ffc107; border: none; padding: 5px 10px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo">AVIATOR <span>VIP</span></div>
        <div class="user-panel">
            <div class="balance-box">PKR <span id="user-balance">0.00</span></div>
            <button id="auth-btn" class="btn-auth" onclick="handleAuth()">Sign in with Google</button>
        </div>
    </header>

    <div class="game-container">
        <div class="canvas-card">
            <div id="multiplier" class="multiplier-overlay">1.00x</div>
            
            <!-- Admin Controller -->
            <div class="admin-box">
                <input type="number" id="admin-target" placeholder="Multiplier" step="0.1" value="2.0">
                <button onclick="setAdminTarget()">Set Crash</button>
            </div>

            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls-card">
            <!-- Bet Panel 1 -->
            <div class="bet-box">
                <div class="input-group">
                    <span style="color:#aaa;">Amount PKR:</span>
                    <input type="number" id="bet-amount" value="100" min="10">
                </div>
                <button id="main-btn" class="btn-action btn-bet" onclick="handleBetClick()">BET</button>
            </div>
            <!-- Information Panel -->
            <div class="bet-box" style="justify-content: center; align-items: center;">
                <p style="color:#aaa; font-size:14px; text-align:center;">EasyPaisa Real Cash Deposit Active.<br>Sign in to play & win!</p>
            </div>
        </div>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDu-REPLACE_WITH_YOUR_KEY",
            authDomain: "adminalvi.firebaseapp.com",
            projectId: "adminalvi",
            storageBucket: "adminalvi.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123def456"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userBalance = 0.00;

        // --- Sound Engine (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let engineOsc = null;

        function playEngineSound(pitch) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!engineOsc) {
                engineOsc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.setValueAtTime(60, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                engineOsc.connect(gain);
                gain.connect(audioCtx.destination);
                engineOsc.start();
            }
            engineOsc.frequency.setValueAtTime(60 + pitch * 40, audioCtx.currentTime);
        }

        function stopEngineSound() {
            if (engineOsc) {
                engineOsc.stop();
                engineOsc = null;
            }
        }

        function playCrashSound() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- Auth Mechanics ---
        function handleAuth() {
            if (currentUser) {
                auth.signOut();
            } else {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider);
            }
        }

        auth.onAuthStateChanged(user => {
            currentUser = user;
            const authBtn = document.getElementById('auth-btn');
            if (user) {
                authBtn.innerText = "Sign Out";
                const userRef = db.collection('users').doc(user.uid);
                userRef.get().then(doc => {
                    if (doc.exists) {
                        userBalance = doc.data().balance || 0.00;
                    } else {
                        userBalance = 0.00; // Direct 0 balance for real experience
                        userRef.set({ balance: 0.00, email: user.email });
                    }
                    updateBalanceUI();
                });
            } else {
                authBtn.innerText = "Sign in with Google";
                userBalance = 0.00;
                updateBalanceUI();
            }
        });

        function updateBalanceUI() {
            document.getElementById('user-balance').innerText = userBalance.toFixed(2);
            if (currentUser) {
                db.collection('users').doc(currentUser.uid).update({ balance: userBalance });
            }
        }

        // --- Game Engine Variables ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentMultiplier = 1.00;
        let crashTarget = 2.00;
        let gameState = 'IDLE'; // IDLE, RUNNING, CRASHED
        let progress = 0;
        let currentBet = 0;
        let hasBetted = false;
        let particles = [];

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function setAdminTarget() {
            const val = parseFloat(document.getElementById('admin-target').value);
            if (val > 1.0) {
                crashTarget = val;
                alert('Target Multiplier set to ' + val + 'x');
            }
        }

        // --- Jet Drawing Function ---
        function drawVIPJet(x, y) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(-Math.PI / 12); // Slightly tilted upwards

            // Jet Body (Sleek Red Fighter)
            ctx.fillStyle = "#e50914";
            ctx.beginPath();
            ctx.moveTo(30, 0);
            ctx.lineTo(-20, -12);
            ctx.lineTo(-15, 0);
            ctx.lineTo(-20, 12);
            ctx.closePath();
            ctx.fill();

            // Cockpit Glass
            ctx.fillStyle = "#00d2ff";
            ctx.beginPath();
            ctx.arc(5, -2, 5, 0, Math.PI * 2);
            ctx.fill();

            // Wing Tail
            ctx.fillStyle = "#b20710";
            ctx.beginPath();
            ctx.moveTo(-10, 0);
            ctx.lineTo(-22, -18);
            ctx.lineTo(-15, 0);
            ctx.closePath();
            ctx.fill();

            // Fire Exhaust Particles
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: x - 25,
                    y: y + (Math.random() * 6 - 3),
                    radius: Math.random() * 4 + 2,
                    alpha: 1,
                    color: Math.random() > 0.5 ? '#ff4500' : '#ffcc00'
                });
            }

            ctx.restore();
        }

        function drawParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.fill();
                ctx.globalAlpha = 1;

                p.x -= 3;
                p.alpha -= 0.04;
                if (p.alpha <= 0) particles.splice(i, 1);
            }
        }

        // --- Game Loop ---
        function runGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Grid Lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 40) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            if (gameState === 'RUNNING') {
                progress += 0.005;
                currentMultiplier += 0.008 * Math.pow(progress, 1.5);
                
                playEngineSound(currentMultiplier);
                document.getElementById('multiplier').innerText = currentMultiplier.toFixed(2) + 'x';
                document.getElementById('multiplier').classList.remove('crashed');

                // Flight Path Curve Calculation
                let startX = 50;
                let startY = canvas.height - 50;
                let endX = startX + (canvas.width - 150) * Math.min(progress, 1);
                let endY = startY - (canvas.height - 150) * Math.min(Math.pow(progress, 0.8), 1);

                // Draw Curved Line
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.quadraticCurveTo(startX + (endX - startX) / 2, startY, endX, endY);
                ctx.strokeStyle = "#e50914";
                ctx.lineWidth = 5;
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#e50914";
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Draw Red Smoke Engine Trail
                drawParticles();

                // Draw Jet
                drawVIPJet(endX, endY);

                // Check Crash Condition
                if (currentMultiplier >= crashTarget) {
                    triggerCrash();
                }
            } else if (gameState === 'CRASHED') {
                document.getElementById('multiplier').innerText = 'FLEW AWAY! (' + currentMultiplier.toFixed(2) + 'x)';
                document.getElementById('multiplier').classList.add('crashed');
            }

            requestAnimationFrame(runGame);
        }

        function triggerCrash() {
            gameState = 'CRASHED';
            stopEngineSound();
            playCrashSound();
            
            const mainBtn = document.getElementById('main-btn');
            if (hasBetted) {
                hasBetted = false;
                alert('Flew Away! You lost PKR ' + currentBet);
            }
            
            mainBtn.innerText = "BET";
            mainBtn.className = "btn-action btn-bet";

            setTimeout(() => {
                resetGame();
            }, 3000);
        }

        function resetGame() {
            gameState = 'IDLE';
            currentMultiplier = 1.00;
            progress = 0;
            document.getElementById('multiplier').innerText = '1.00x';
            document.getElementById('multiplier').classList.remove('crashed');
        }

        function handleBetClick() {
            if (!currentUser) {
                alert('Pehle Google se Sign in karein!');
                return;
            }

            const mainBtn = document.getElementById('main-btn');
            const amountInput = parseFloat(document.getElementById('bet-amount').value);

            if (gameState === 'IDLE') {
                if (userBalance < amountInput) {
                    alert('Aapka balance kam hai! EasyPaisa se deposit karein.');
                    return;
                }
                userBalance -= amountInput;
                currentBet = amountInput;
                hasBetted = true;
                updateBalanceUI();

                gameState = 'RUNNING';
                mainBtn.innerText = "CASH OUT";
                mainBtn.className = "btn-action btn-cashout";
            } else if (gameState === 'RUNNING' && hasBetted) {
                // Cashout Trigger
                const winAmount = currentBet * currentMultiplier;
                userBalance += winAmount;
                updateBalanceUI();
                hasBetted = false;
                alert('Success! Won PKR ' + winAmount.toFixed(2));
                
                mainBtn.innerText = "WAITING...";
                mainBtn.className = "btn-action btn-disabled";
            }
        }

        runGame();
    </script>
</body>
</html>
